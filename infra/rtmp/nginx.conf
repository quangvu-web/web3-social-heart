worker_processes auto;

events {
  worker_connections 1024;
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;

      on_publish http://rtmp-callback:8080/live/rtmp/on-publish;
      on_done http://rtmp-callback:8080/live/rtmp/on-done;

      exec ffmpeg -hide_banner -loglevel warning -i rtmp://127.0.0.1:1935/live/$name
        -c:v libx264 -preset veryfast -tune zerolatency -profile:v main
        -c:a aac -ar 44100 -b:a 128k
        -f hls -hls_time 2 -hls_list_size 6 -hls_flags delete_segments+append_list+program_date_time
        -hls_segment_filename /var/www/hls/live/$name_%05d.ts
        /var/www/hls/live/$name.m3u8;

      exec_kill_signal term;
    }
  }
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;

    location /health {
      access_log off;
      return 200 "ok\n";
    }

    location /hls/ {
      alias /var/www/hls/live/;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;

      if ($request_method = OPTIONS) {
        return 204;
      }

      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
    }
  }
}
