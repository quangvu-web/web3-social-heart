    <!-- Critical CSS inline for fastest FCP/LCP -->
    <style>
      /* Reset & Critical Layout */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;font-size:16px}
      body{
        min-height:100vh;
        background:#f0f2f5;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        text-rendering:optimizeSpeed;
        -webkit-font-smoothing:antialiased
      }
      #root{min-height:100vh}
      
      /* Initial loader - visible before React hydrates */
      .initial-loader{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5}
      .spinner{width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#22c55e;border-radius:50%;animation:spin .6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      
      /* Auth page critical styles - prevent layout shift */
      .auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
      .auth-form-skeleton{width:100%;max-width:28rem;min-height:500px;background:#fff;border-radius:1.5rem;box-shadow:0 4px 24px rgba(251,191,36,0.2)}
      
      /* LCP image container - fixed dimensions */
      .lcp-logo{width:64px;height:64px;border-radius:50%;background:#e5e7eb}
    </style>

  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      window.__FUN_PROFILE_APP_MOUNTED__ = false;
      window.setTimeout(function () {
        if (window.__FUN_PROFILE_APP_BOOTSTRAP_STARTED__ || window.__FUN_PROFILE_APP_MOUNTED__ || window.__FUN_PROFILE_APP_RECOVERY_RENDERED__) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><div style="max-width:560px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(15,23,42,.12)"><h1 style="margin:0 0 10px;font-size:22px;color:#111827">Không thể tải FUN Profile</h1><p style="margin:0 0 18px;color:#4b5563;line-height:1.55">Ứng dụng có thể vừa được cập nhật hoặc kết nối đang gặp sự cố.</p><div style="display:flex;flex-wrap:wrap;gap:8px"><button onclick="window.location.reload()" style="border:0;border-radius:999px;background:#16a34a;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer">Tải lại ứng dụng</button><button onclick="(async function(){try{if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister()}))}if(window.caches){var k=await caches.keys();await Promise.all(k.map(function(x){return caches.delete(x)}))}}finally{window.location.reload()}})()" style="border:1px solid #d1d5db;border-radius:999px;background:#fff;color:#111827;padding:10px 14px;font-weight:700;cursor:pointer">Xóa cache và tải lại</button></div><details style="margin-top:18px;color:#6b7280;font-size:12px"><summary>Chi tiết lỗi</summary><pre style="white-space:pre-wrap;word-break:break-word;background:#f9fafb;border-radius:10px;padding:10px">' + JSON.stringify({ code: 'bootstrap_timeout', url: window.location.href, browser: navigator.userAgent, timestamp: new Date().toISOString() }, null, 2) + '</pre></details></div></div>';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
