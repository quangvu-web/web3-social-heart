# The function validates the user JWT itself so it can return CORS headers
# consistently for authentication errors instead of being rejected by the
# Supabase gateway before the function runs.
[functions.get-upload-url]
verify_jwt = false

# Telegram authenticates webhook requests with TELEGRAM_WEBHOOK_SECRET rather
# than a Supabase user JWT. The function validates that secret itself.
[functions.telegram-webhook]
verify_jwt = false
