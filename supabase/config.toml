# The function validates the user JWT itself so it can return CORS headers
# consistently for authentication errors instead of being rejected by the
# Supabase gateway before the function runs.
[functions.get-upload-url]
verify_jwt = false

# Telegram authenticates webhook requests with TELEGRAM_WEBHOOK_SECRET rather
# than a Supabase user JWT. The function validates that secret itself.
[functions.telegram-webhook]
verify_jwt = false

# Telegram community webhook validates Telegram’s secret token itself.
[functions.telegram-community-webhook]
verify_jwt = false

# Scheduled join recovery authenticates itself with x-cron-secret.
[functions.telegram-community-join-recovery]
verify_jwt = false

# MCP server: OAuth discovery and the 401 challenge must reach the function
# without a gateway JWT; @lovable.dev/mcp-js validates bearer tokens itself.
[functions.mcp]
verify_jwt = false

# Angel Caption Bot: Recall webhooks authenticate via signature; start/stop via internal token.
[functions.angel-caption]
verify_jwt = false
